<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>年会 AI 工具箱</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a1a2e" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f0f2f5;
        color: #333;
        padding-bottom: 70px;
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
      }
      .hdr {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        color: #fff;
        padding: 16px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .hdr h1 {
        font-size: 20px;
        color: #ffd93d;
      }
      .hdr p {
        font-size: 13px;
        color: #8892b0;
        margin-top: 2px;
      }
      .panel {
        display: none;
        padding: 12px;
      }
      .panel.active {
        display: block;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
      }
      .ct {
        font-size: 16px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 10px;
      }
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        cursor: pointer;
        text-align: center;
        font-weight: 500;
      }
      .btn-p {
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #fff;
      }
      .btn-s {
        background: linear-gradient(135deg, #10b981, #34d399);
        color: #fff;
      }
      .btn-w {
        background: linear-gradient(135deg, #f59e0b, #fbbf24);
        color: #fff;
      }
      .btn-d {
        background: linear-gradient(135deg, #ef4444, #f87171);
        color: #fff;
      }
      .btn:active {
        opacity: 0.8;
      }
      .tag {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 12px;
        margin: 3px;
        cursor: pointer;
        background: #f3f4f6;
        color: #666;
      }
      .tag.sel {
        background: #4f46e5;
        color: #fff;
      }
      .tag.sel2 {
        background: #f59e0b;
        color: #fff;
      }
      textarea,
      input[type='text'],
      input[type='number'] {
        width: 100%;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
        margin-bottom: 8px;
        font-family: inherit;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      .result {
        background: #f9fafb;
        border-radius: 10px;
        padding: 12px;
        margin-top: 10px;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        max-height: 400px;
        overflow-y: auto;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .tab-btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        background: #f3f4f6;
        color: #666;
      }
      .tab-btn.active {
        background: #4f46e5;
        color: #fff;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .grid-item {
        background: #fff;
        border-radius: 14px;
        padding: 24px 12px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        cursor: pointer;
      }
      .grid-item:active {
        transform: scale(0.96);
      }
      .grid-item .icon {
        font-size: 36px;
        display: block;
        margin-bottom: 6px;
      }
      .grid-item .title {
        font-size: 15px;
        font-weight: 600;
        color: #1a1a2e;
        display: block;
      }
      .grid-item .desc {
        font-size: 11px;
        color: #9ca3af;
        display: block;
        margin-top: 2px;
      }
      .nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        display: flex;
        background: #fff;
        border-top: 1px solid #e5e7eb;
        z-index: 100;
      }
      .nav-item {
        flex: 1;
        text-align: center;
        padding: 8px 0;
        font-size: 10px;
        color: #9ca3af;
        cursor: pointer;
      }
      .nav-item .ni {
        font-size: 22px;
        display: block;
      }
      .nav-item.active {
        color: #4f46e5;
      }
      .opt {
        padding: 10px 14px;
        margin: 4px 0;
        background: #f9fafb;
        border-radius: 10px;
        font-size: 13px;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .opt.sel {
        border-color: #4f46e5;
        background: #eef2ff;
        color: #4f46e5;
        font-weight: 500;
      }
      .msg-item {
        border-bottom: 1px solid #f3f4f6;
        padding: 10px 0;
      }
      .msg-item .mn {
        font-weight: 600;
        color: #4f46e5;
        font-size: 13px;
      }
      .msg-item .mt {
        font-size: 14px;
        margin-top: 4px;
        line-height: 1.5;
      }
      .msg-item .ml {
        color: #ef4444;
        font-size: 11px;
        margin-top: 4px;
      }
      .stat-row {
        display: flex;
        gap: 12px;
        text-align: center;
      }
      .stat-box {
        flex: 1;
        padding: 12px;
        background: #f9fafb;
        border-radius: 10px;
      }
      .stat-box .sn {
        font-size: 28px;
        font-weight: 700;
        color: #4f46e5;
      }
      .stat-box .sl {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 2px;
      }
      .rank-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13px;
      }
      .rank-row .rr {
        color: #4f46e5;
        font-weight: 600;
      }
      .loading {
        text-align: center;
        padding: 30px;
        color: #9ca3af;
        font-size: 13px;
      }
      .switch-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #ccc;
        border-radius: 24px;
        transition: 0.3s;
      }
      .slider:before {
        position: absolute;
        content: '';
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.3s;
      }
      input:checked + .slider {
        background: #4f46e5;
      }
      input:checked + .slider:before {
        transform: translateX(20px);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="hdr">
      <h1>🎉 年会 AI 欢乐工具箱</h1>
      <p>文稿 · 形象 · 互动 · 游戏</p>
    </div>

    <div id="p-home" class="panel active"></div>
    <div id="p-wenan" class="panel"></div>
    <div id="p-avatar" class="panel"></div>
    <div id="p-wall" class="panel"></div>
    <div id="p-game" class="panel"></div>
    <div id="p-lottery" class="panel"></div>
    <div id="p-signin" class="panel"></div>

    <div class="nav">
      <div class="nav-item active" data-p="home"><span class="ni">🏠</span>首页</div>
      <div class="nav-item" data-p="wenan"><span class="ni">✍️</span>文稿</div>
      <div class="nav-item" data-p="avatar"><span class="ni">🪄</span>形象</div>
      <div class="nav-item" data-p="wall"><span class="ni">💬</span>互动</div>
      <div class="nav-item" data-p="lottery"><span class="ni">🎰</span>抽奖</div>
      <div class="nav-item" data-p="signin"><span class="ni">✅</span>签到</div>
      <div class="nav-item" data-p="game"><span class="ni">🎮</span>游戏</div>
    </div>

    <script>
      const API = '';
      // 微信扫码签到自动检测
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get('signed') === '1') {
          var name = q.get('name') || '微信用户';
          var openid = q.get('openid') || '';
          var avatar = q.get('avatar') || '';
          gSigninDone = true;
          gSigninName = name;
          gSigninWxAvatar = avatar;
          gSigninOpenid = openid;
          gSigninSource = 'wechat';
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, '', location.pathname);
          }
          setTimeout(function () {
            var nav = document.querySelector('.nav-item[data-p="signin"]');
            if (nav) nav.click();
          }, 300);
        } else if (q.get('scan') === '1') {
          setTimeout(function () {
            var nav = document.querySelector('.nav-item[data-p="signin"]');
            if (nav) nav.click();
          }, 300);
        }
      })();
      async function get(p) {
        const r = await fetch(API + '/api' + p, {
          headers: { 'X-User-Token': localStorage.getItem('token') || '' },
        });
        let t = r.headers.get('X-User-Token');
        if (t) localStorage.setItem('token', t);
        return r.json();
      }
      async function post(p, b) {
        const r = await fetch(API + '/api' + p, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User-Token': localStorage.getItem('token') || '',
          },
          body: JSON.stringify(b),
        });
        let t = r.headers.get('X-User-Token');
        if (t) localStorage.setItem('token', t);
        return r.json();
      }
      function $(s) {
        return document.querySelector(s);
      }
      function $$(s) {
        return document.querySelectorAll(s);
      }
      let features = {};
      async function loadFeatures() {
        try {
          const r = await get('/settings');
          if (r.code === 0 && r.data && r.data.features) features = r.data.features;
        } catch {}
      }
      function isOn(name) {
        return features[name] !== false;
      }
      function esc(s) {
        const d = document.createElement('div');
        d.textContent = String(s || '');
        return d.innerHTML;
      }

      function showDisabled(id) {
        var e = document.getElementById(id);
        e.innerHTML =
          '<div style="text-align:center;padding:60px 20px;color:#9ca3af;"><div style="font-size:48px">🔒</div><p style="margin-top:12px">该功能已关闭</p></div>';
      }
      // Navigation
      $$('.nav-item').forEach((el) =>
        el.addEventListener('click', () => {
          const p = el.dataset.p;
          $$('.nav-item').forEach((x) => x.classList.remove('active'));
          el.classList.add('active');
          $$('.panel').forEach((x) => x.classList.remove('active'));
          $('#p-' + p).classList.add('active');
          if (p === 'home') loadFeatures().then(() => renderHome());
          if (p === 'wenan') renderWenan();
          if (p === 'wall') {
            renderWall();
            renderLottery();
          }
          if (p === 'lottery') renderLotteryPage();
          if (p === 'signin') renderSignin();
          if (p === 'game') renderGame();
        })
      );

      // ===== HOME =====
      function renderHome() {
        $('#p-home').innerHTML = `
    <div class="grid2">
      <div class="grid-item" onclick="navTo('wenan')"><span class="icon">✍️</span><span class="title">文稿创作</span><span class="desc">致辞·串词·剧本</span></div>
      <div class="grid-item" onclick="navTo('avatar')"><span class="icon">🪄</span><span class="title">形象名片</span><span class="desc">头像·人设卡片</span></div>
      <div class="grid-item" onclick="navTo('wall')"><span class="icon">💬</span><span class="title">现场互动</span><span class="desc">留言墙·抽奖</span></div>
      <div class="grid-item" onclick="navTo('game')"><span class="icon">🎮</span><span class="title">暖场游戏</span><span class="desc">答题·接龙·红包</span></div>
      <div class="grid-item" onclick="gTab='redpacket';navTo('game')"><span class="icon">🧧</span><span class="title">红包雨</span><span class="desc">点击抢红包</span></div>
      <div class="grid-item" onclick="gTab='shake';navTo('game')"><span class="icon">📳</span><span class="title">摇一摇赛跑</span><span class="desc">全场摇手机竞速</span></div>
      <div class="grid-item" onclick="navTo('signin')"><span class="icon">✅</span><span class="title">扫码签到</span><span class="desc">签到上大屏</span></div>
    </div>
    <p style="text-align:center;color:#9ca3af;font-size:12px;margin-top:20px;">💡 管理员请用电脑打开管理后台控制抽奖</p>`;
      }
      function navTo(p) {
        $$('.nav-item').forEach((x) => {
          x.classList.remove('active');
          if (x.dataset.p === p) x.classList.add('active');
        });
        $$('.panel').forEach((x) => x.classList.remove('active'));
        $('#p-' + p).classList.add('active');
        if (p === 'wenan') renderWenan();
        if (p === 'wall') {
          renderWall();
          renderLottery();
        }
        if (p === 'game') renderGame();
        if (p === 'signin') renderSignin();
      }

      // ===== WENAN =====
      let wMode = 'wenan',
        wType = '领导致辞',
        wStyle = '正式大气',
        wScript = '小品',
        wSong = '',
        wTopic = '',
        wCount = 500,
        wPeople = 3,
        wDur = 5;

      function renderWenan() {
        $('#p-wenan').innerHTML = `
    <div class="tabs">
      <button class="tab-btn ${wMode === 'wenan' ? 'active' : ''}" onclick="setWMode('wenan')">📝 文案</button>
      <button class="tab-btn ${wMode === 'script' ? 'active' : ''}" onclick="setWMode('script')">🎭 剧本</button>
      <button class="tab-btn ${wMode === 'lyrics' ? 'active' : ''}" onclick="setWMode('lyrics')">🎵 改歌词</button>
    </div>
    ${wMode === 'wenan' ? wenanPanel() : ''}
    ${wMode === 'script' ? scriptPanel() : ''}
    ${wMode === 'lyrics' ? lyricsPanel() : ''}
    <div id="wenanResult"></div>`;
      }

      function wenanPanel() {
        const types = [
          '领导致辞',
          '主持串词',
          '颁奖词',
          '抽奖话术',
          '员工评语',
          '年会标语',
          '对联',
        ];
        return `<div class="card"><div class="ct">文案类型</div>${types.map((t) => `<span class="tag${wType === t ? ' sel' : ''}" onclick="wType='${t}';renderWenan()">${t}</span>`).join('')}</div>
    <div class="card"><div class="ct">风格</div>${['正式大气', '幽默轻松', '温情走心'].map((s) => `<span class="tag${wStyle === s ? ' sel2' : ''}" onclick="wStyle='${s}';renderWenan()">${s}</span>`).join('')}</div>
    <div class="card"><div class="ct">主题（选填）</div><input type="text" placeholder="如：2026年会开场" value="${esc(wTopic)}" oninput="wTopic=this.value"></div>
    <div class="card"><div class="ct">字数：${wCount}</div><input type="range" min="100" max="2000" value="${wCount}" oninput="wCount=parseInt(this.value);this.nextElementSibling.textContent=wCount"><span>${wCount}</span></div>
    <button class="btn btn-p" style="width:100%" onclick="genWenan()">✨ AI 生成</button>`;
      }

      function scriptPanel() {
        const types = ['小品', '脱口秀', '三句半'];
        return `<div class="card"><div class="ct">节目类型</div>${types.map((t) => `<span class="tag${wScript === t ? ' sel' : ''}" onclick="wScript='${t}';renderWenan()">${t}</span>`).join('')}</div>
    <div class="card"><div class="ct">风格</div>${['幽默轻松', '正式大气', '温情走心'].map((s) => `<span class="tag${wStyle === s ? ' sel2' : ''}" onclick="wStyle='${s}';renderWenan()">${s}</span>`).join('')}</div>
    <div class="card"><div class="ct">主题</div><input type="text" placeholder="如：技术部年会" value="${esc(wTopic)}" oninput="wTopic=this.value"></div>
    <div class="card"><div class="ct">人数：${wPeople} | 时长：${wDur}分钟</div>
      <input type="range" min="1" max="10" value="${wPeople}" oninput="wPeople=parseInt(this.value);renderWenan()">
      <input type="range" min="1" max="15" value="${wDur}" oninput="wDur=parseInt(this.value);renderWenan()"></div>
    <button class="btn btn-p" style="width:100%" onclick="genScript()">✨ AI 生成剧本</button>`;
      }

      function lyricsPanel() {
        return `<div class="card"><div class="ct">原歌曲名</div><input type="text" placeholder="例如：恭喜发财" value="${esc(wSong)}" oninput="wSong=this.value"></div>
    <div class="card"><div class="ct">主题</div><input type="text" placeholder="如：公司年会" value="${esc(wTopic)}" oninput="wTopic=this.value"></div>
    <button class="btn btn-p" style="width:100%" onclick="genLyrics()">🎵 改编歌词</button>`;
      }

      function setWMode(m) {
        wMode = m;
        renderWenan();
      }

      async function genWenan() {
        const res = await post('/wenan/generate', {
          type: wType,
          style: wStyle,
          topic: wTopic,
          wordCount: wCount,
        });
        showWenanResult(res);
      }
      async function genScript() {
        const res = await post('/wenan/script', {
          scriptType: wScript,
          topic: wTopic,
          people: wPeople,
          duration: wDur,
          style: wStyle,
        });
        showWenanResult(res);
      }
      async function genLyrics() {
        const res = await post('/wenan/lyrics', { song: wSong, topic: wTopic, style: wStyle });
        showWenanResult(res);
      }
      function showWenanResult(res) {
        if (res.code !== 0) {
          $('#wenanResult').innerHTML = `<div class="card" style="color:#ef4444">${res.msg}</div>`;
          return;
        }
        const t = res.data.text || '';
        $('#wenanResult').innerHTML =
          `<div class="card"><div class="ct">生成结果</div><div class="result">${esc(t)}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn btn-s" style="flex:1" onclick="copyText('${esc(t).replace(/'/g, "\\'")}')">📋 复制</button>
    <button class="btn btn-w" style="flex:1" onclick="rewriteText()">🔄 改写</button></div></div>`;
      }
      function copyText(t) {
        navigator.clipboard.writeText(t).then(() => alert('已复制'));
      }
      async function rewriteText() {
        const res = await post('/wenan/rewrite', {
          text: $('#wenanResult .result').textContent,
          style: wStyle,
        });
        if (res.code === 0) {
          $('#wenanResult .result').textContent = res.data.text;
        }
      }

      // ===== AVATAR =====
      let aMode = 'avatar',
        aStyle = '古风',
        aNick = '',
        aRole = '';

      function renderAvatar() {
        const styles = ['财神', '古风', 'Q版', '职场潮人', '年会礼服'];
        if (aMode === 'avatar') {
          $('#p-avatar').innerHTML = `
      <div class="tabs">
        <button class="tab-btn active">🪄 趣味头像</button>
        <button class="tab-btn" onclick="aMode='persona';renderAvatar()">🏷️ 年度人设</button>
      </div>
      <div class="card"><div class="ct">选择风格</div>${styles.map((s) => `<span class="tag${aStyle === s ? ' sel' : ''}" onclick="aStyle='${s}';renderAvatar()">${s}</span>`).join('')}</div>
      <button class="btn btn-p" style="width:100%" onclick="genAvatar()">🎨 生成头像</button>
      <div id="avatarResult"></div>`;
        } else {
          $('#p-avatar').innerHTML = `
      <div class="tabs">
        <button class="tab-btn" onclick="aMode='avatar';renderAvatar()">🪄 趣味头像</button>
        <button class="tab-btn active">🏷️ 年度人设</button>
      </div>
      <div class="card"><div class="ct">你的信息</div>
        <input type="text" placeholder="昵称 *" value="${esc(aNick)}" oninput="aNick=this.value">
        <input type="text" placeholder="岗位（如：后端工程师）" value="${esc(aRole)}" oninput="aRole=this.value"></div>
      <button class="btn btn-p" style="width:100%" onclick="genPersona()">✨ 生成年度人设卡片</button>
      <div id="avatarResult"></div>`;
        }
      }
      async function genAvatar() {
        const res = await post('/avatar/generate', { style: aStyle });
        if (res.code === 0)
          $('#avatarResult').innerHTML =
            `<div class="card"><img src="${res.data.url}" style="width:100%;border-radius:10px" onerror="this.src=''"><p style="text-align:center;margin-top:6px;font-size:12px;color:#9ca3af">长按图片保存</p></div>`;
      }
      async function genPersona() {
        if (!aNick.trim()) {
          alert('请填写昵称');
          return;
        }
        const res = await post('/avatar/persona', { nickname: aNick, role: aRole });
        if (res.code === 0)
          $('#avatarResult').innerHTML =

      // ===== 摇一摇赛跑 =====
      var shakeSensor = null;
      function setupShakeListener() {
        if (
          typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function'
        ) {
          // iOS 13+ 需要权限
          DeviceMotionEvent.requestPermission()
            .then(function (state) {
              if (state === 'granted') startShakeSensor();
            })
            .catch(function () {});
        } else {
          startShakeSensor();
        }
      }
      function startShakeSensor() {
        if (shakeSensor) return;
        var lastShake = 0;
        shakeSensor = function (e) {
          var acc = e.accelerationIncludingGravity;
          if (!acc) return;
          var force = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
          if (force > 15 && Date.now() - lastShake > 200 && gShakeJoined && gShakeActive) {
            lastShake = Date.now();
            post('/game/shake/shake', { raceId: gShakeRaceId, nickname: gShakeNick }).then(
              function (res) {
                if (res.code === 0 && res.data) {
                  gShakeProgress = res.data.progress || 0;
                  renderGame();
                }
              }
            );
          }
        };
        window.addEventListener('devicemotion', shakeSensor);
      }
      function stopShakeSensor() {
        if (shakeSensor) {
          window.removeEventListener('devicemotion', shakeSensor);
          shakeSensor = null;
        }
      }
      async function joinShake() {
        if (!gShakeNick.trim()) {
          alert('请输入昵称');
          return;
        }
        var res = await post('/game/shake/join', { raceId: gShakeRaceId, nickname: gShakeNick });
        if (res.code === 0) {
          gShakeJoined = true;
          setupShakeListener();
          renderGame();
        }
      }
      async function manualShake() {
        if (!gShakeActive || !gShakeJoined || !gShakeRaceId) return;
        var btn = document.getElementById('manualShakeBtn');
        if (btn) {
          btn.disabled = true;
          btn.textContent = '摇动中...';
        }
        var res = await post('/game/shake/shake', { raceId: gShakeRaceId, nickname: gShakeNick });
        if (res.code === 0 && res.data) {
          gShakeProgress = res.data.progress || 0;
          renderGame();
        }
        setTimeout(function () {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '👆 点我摇一次';
          }
        }, 300);
      }

      // ===== 红包雨 =====
      async function claimRedpacket() {
        if (!gRpNick.trim()) {
          alert('请输入昵称');
          return;
        }
        var res = await post('/redpacket/claim', { nickname: gRpNick });
        var el = document.getElementById('rpResult');
        if (res.code === 0) {
          el.innerHTML =
            '<div style="font-size:36px">🎉</div><div style="font-size:24px;color:#10b981;font-weight:700;margin:8px 0">¥' +
            res.data.amount.toFixed(2) +
            '</div><div style="color:#8892b0">恭喜抢到红包！</div>';
        } else {
          el.innerHTML = '<div style="color:#ef4444">' + res.msg + '</div>';
        }
      }

      // ===== 签到 =====
      let gSigninName = '',
        gSigninDept = '',
        gSigninDone = false,
        gSigninWxAvatar = '',
        gSigninOpenid = '',
        gSigninSource = '';
      function renderSignin() {
        if (gSigninDone) {
          var avatarHtml = '';
          if (gSigninSource === 'wechat' && gSigninWxAvatar) {
            avatarHtml =
              '<img src="' +
              esc(gSigninWxAvatar) +
              '" style="width:64px;height:64px;border-radius:50%;margin:8px 0" onerror="this.style.display=none">';
          }
          var sourceTag =
            gSigninSource === 'wechat'
              ? '<span style="display:inline-block;background:#07c160;color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;margin-top:6px">微信授权登录</span>'
              : '';
          $('#p-signin').innerHTML =
            '<div class="card" style="text-align:center"><div style="font-size:64px">✅</div><div style="font-size:24px;font-weight:700;color:#10b981;margin:12px 0">签到成功！</div>' +
            avatarHtml +
            '<p style="color:#8892b0">' +
            esc(gSigninName) +
            ' 已上大屏</p>' +
            sourceTag +
            '<button class="btn btn-p" style="margin-top:16px" onclick="gSigninDone=false;renderSignin()">再次签到</button></div>';
          return;
        }
        $('#p-signin').innerHTML =
          '<div class="card" style="text-align:center"><div style="font-size:48px">📋</div><div style="font-size:20px;font-weight:700;margin:8px 0">扫码签到</div><p style="color:#8892b0;font-size:13px">填写信息，签到上大屏</p></div><div class="card"><input type="text" placeholder="你的姓名 *" value="' +
          esc(gSigninName) +
          '" oninput="gSigninName=this.value"><input type="text" placeholder="部门（选填）" value="' +
          esc(gSigninDept) +
          '" oninput="gSigninDept=this.value"><button class="btn btn-s" style="width:100%" onclick="doSignin()">✅ 立即签到</button><div id="signinResult" style="text-align:center;margin-top:10px"></div></div>';
      }
      async function doSignin() {
        if (!gSigninName.trim()) {
          alert('请输入姓名');
          return;
        }
        var res = await post('/signin/checkin', { nickname: gSigninName, dept: gSigninDept });
        var el = document.getElementById('signinResult');
        if (res.code === 0) {
          gSigninDone = true;
          renderSignin();
        } else {
          el.innerHTML = '<div style="color:#ef4444">' + res.msg + '</div>';
        }
      }
      // ===== INIT =====
      loadFeatures().then(() => renderHome());
      setInterval(() => {
        var activePanel = document.querySelector('.panel.active');
        if (!activePanel) return;
        var pid = activePanel.id;
        if (pid === 'p-wall' && wallTab === 'wall') loadMessages();
        if (pid === 'p-lottery') renderLotteryPage();
        if (pid === 'p-game' && gTab === 'quiz') loadRanks();
      }, 15000);
    </script>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      var socket = io();
      socket.on('shake:raceStarted', function (data) {
        gShakeRaceId = data.raceId;
        gShakeActive = true;
        gShakeJoined = false;
        gShakeProgress = 0;
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-game' &&
          gTab === 'shake'
        )
          renderGame();
      });
      socket.on('shake:winner', function (data) {
        gShakeActive = false;
        gShakeJoined = false;
        stopShakeSensor();
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-game' &&
          gTab === 'shake'
        )
          renderGame();
      });
      socket.on('redpacket:start', function (data) {
        gRpActive = true;
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-game' &&
          gTab === 'redpacket'
        )
          renderGame();
      });
      socket.on('redpacket:end', function () {
        gRpActive = false;
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-game' &&
          gTab === 'redpacket'
        )
          renderGame();
      });
      socket.on('shake:reset', function () {
        gShakeActive = false;
        gShakeJoined = false;
        gShakeRaceId = null;
        gShakeProgress = 0;
        stopShakeSensor();
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-game' &&
          gTab === 'shake'
        )
          renderGame();
      });
      socket.on('wall:updated', function () {
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-wall'
        )
          loadMessages();
      });
      socket.on('lottery:updated', function () {
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-lottery'
        )
          renderLotteryPage();
      });
      socket.on('game:ranksUpdated', function () {
        if (
          (document.querySelector('.panel.active') &&
            document.querySelector('.panel.active').id) === 'p-game'
        )
          loadRanks();
      });
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/mobile/sw.js').catch(function () {});
      }
    </script>
  </body>
</html>
